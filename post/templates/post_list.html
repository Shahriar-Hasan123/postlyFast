{% extends "layout.html" %} 
{% block title %}
<title>Post anythings</title>
{% endblock %} 

{% block content %}
<h1 class="text-center text-white mt-3">PostlyFast</h1>

<a class="btn btn-primary mb-3" href="{% url 'create_post' %}">Create a Post</a>

<div class="container">
    <div class="row g-4">  <!-- g-4 = gap -->
        
        {% for post in allPost %}
        <div class="col-md-4 col-lg-3">
            <div class="card">
                <img src="{{ post.image.url }}" class="card-img-top" alt="Image" 
                     style="height: 200px; object-fit: cover;">
                
                <div class="card-body">
                    <h5 class="card-title">{{ post.user.username }}</h5>
                    <p class="card-text flex-grow-1 overflow-auto" style="max-height: 120px;">
                        {{ post.text }}
                    </p>
                    {% if user == post.user %}
                    <a href="{% url 'update_post' post.id %}" class="btn btn-warning btn-sm">Update</a>
                    <a href="{% url 'delete_post' post.id %}" class="btn btn-danger btn-sm">Delete</a>
                    {% endif %}
                </div>
            </div>
        </div>
        {% endfor %}

    </div>
</div>

{% endblock %}
