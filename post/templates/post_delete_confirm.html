{% extends "layout.html" %}

{% block title %}
<title>Delete Post</title>
{% endblock %}

{% block content %}
<div class="container mt-5">
    <h2 class="text-center text-white mb-4">Are you sure you want to delete this post?</h2>

    <form method="post" class="text-center">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger me-2">Delete</button>
        <a href="{% url 'post_list' %}" class="btn btn-warning">Cancel</a>
    </form>
</div>
{% endblock %}
